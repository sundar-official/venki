<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>
<body>

<h2>Student Mark and Grade Calculator</h2>

<label>Subject 1:</label>
<input type="number" id="s1"><br><br>

<label>Subject 2:</label>
<input type="number" id="s2"><br><br>

<label>Subject 3:</label>
<input type="number" id="s3"><br><br>

<label>Subject 4:</label>
<input type="number" id="s4"><br><br>

<label>Subject 5:</label>
<input type="number" id="s5"><br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

<script>
function calculate(){

let s1=Number(document.getElementById("s1").value);
let s2=Number(document.getElementById("s2").value);
let s3=Number(document.getElementById("s3").value);
let s4=Number(document.getElementById("s4").value);
let s5=Number(document.getElementById("s5").value);

let total=s1+s2+s3+s4+s5;
let average=total/5;
let percentage=(total/500)*100;

let grade;

if(percentage>=90)
grade="A+";
else if(percentage>=80)
grade="A";
else if(percentage>=70)
grade="B";
else if(percentage>=60)
grade="C";
else if(percentage>=50)
grade="D";
else
grade="Fail";

document.getElementById("result").innerHTML=
"Total : "+total+
"<br>Average : "+average+
"<br>Percentage : "+percentage.toFixed(2)+"%"+
"<br>Grade : "+grade;

}
</script>

</body>
</html>
